services:
  mongodb:
    image: mongo:8.0
    container_name: codex-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  execution-service:
    build:
      context: ./execution-service
      dockerfile: Dockerfile
    container_name: codex-execution-service
    restart: always
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - EXECUTION_SECRET=codex_internal_secret_sandbox_token_2026
      - PYTHON_BIN=python3

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: codex-api-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/codex_platform
      - JWT_SECRET=super_secret_codex_jwt_key_2026_dev_env_987654321
      - CLIENT_URL=http://localhost:5173
      - EXECUTION_SERVICE_URL=http://execution-service:5050
      - EXECUTION_SECRET=codex_internal_secret_sandbox_token_2026
    depends_on:
      - mongodb
      - execution-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: codex-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
